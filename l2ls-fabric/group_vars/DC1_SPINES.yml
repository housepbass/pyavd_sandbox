---
### group_vars/DC1_SPINES.yml

type: l2spine     # Must be either l2spine|l3spine

# Spine Switches (L2 only)
l2spine:
  defaults:
    platform: cEOSLab
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    mlag_peer_ipv4_pool: 192.168.0.0/24
    mlag_interfaces: [Ethernet4, Ethernet5]
  node_groups:
    - group: SPINES
      nodes:
        - name: clab-l2lS-spine1
          id: 1
          mgmt_ip: 172.20.20.101/24
        - name: clab-l2lS-spine2
          id: 2
          mgmt_ip: 172.20.20.102/24
